server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip para assets estáticos
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    # Cache agressivo para assets com hash (JS/CSS do Vite)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy para a API backend
    # Em produção, BACKEND_HOST é o nome do serviço no EasyPanel (ex: contabil-core)
    location /api/ {
        proxy_pass http://BACKEND_HOST:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Suporte a uploads grandes (PDFs)
        client_max_body_size 50M;
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;
    }

    # SPA fallback — todas as rotas vão para o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
