server {
    listen 3013;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolver interno do Docker — resolve hostnames em runtime (não no startup)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Gzip para assets estáticos
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    # ── Health check próprio do nginx (não depende do backend) ────────────────
    # EasyPanel deve usar este endpoint: /health
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Cache agressivo para assets com hash (JS/CSS do Vite)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Proxy para a API backend ──────────────────────────────────────────────
    location /api/ {
        set $backend "BACKEND_UPSTREAM";
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uploads grandes (PDFs)
        client_max_body_size 50M;
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;
    }

    # ── SPA fallback — todas as rotas vão para index.html ────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
